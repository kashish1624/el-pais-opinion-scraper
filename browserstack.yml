userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}

framework: pytest

buildName: ElPais Assignment Build
projectName: ElPais Opinion Scraper

parallelsPerPlatform: 1

platforms:
  - os: Windows
    osVersion: 11
    browserName: Chrome
    browserVersion: latest

  - os: Windows
    osVersion: 11
    browserName: Firefox
    browserVersion: latest

  - os: OS X
    osVersion: Sonoma
    browserName: Safari
    browserVersion: latest

browserstackLocal: false

debug: true
networkLogs: true
consoleLogs: info